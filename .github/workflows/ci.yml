name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests

      - name: Run unit tests
        run: pytest -q

      - name: Validate repository hygiene
        shell: bash
        run: |
          test ! -d data || (echo "data/ should remain local/generated" && exit 1)
          test ! -d results || (echo "results/ should remain local/generated" && exit 1)
          test ! -d src/__pycache__ || (echo "Python cache should not be committed" && exit 1)
          test ! -d .venv || (echo ".venv/ should remain local" && exit 1)
